# A cluster that archives to Google Cloud Storage.
#
# On GCE this needs **no credentials at all**: pgpod renders
# `repo1-gcs-key-type=auto`, and pgBackRest then authorizes with the
# instance service account. That also removes the ADR 00 §9 concern about
# a container superuser reading object-store credentials — there are none
# to read.
#
# Off GCE you supply a key. `credentials` names a **podman secret** whose
# contents are `KEY=value` lines using pgBackRest's repository option
# names *without* their `repoN-` prefix — pgpod adds the index, so you
# never have to know which repository number your destination became:
#
#   podman secret create pgpod-demo-gcs - <<'EOF'
#   gcs-key-type=token
#   gcs-key=ya29.your-oauth-token
#   EOF
#
# pgpod mounts it at /run/secrets/pgpod-store-<index> and renders those
# options into pgbackrest.conf at 0600. The secret's *name* never reaches
# the instance spec, which travels in an environment variable that
# `podman inspect` prints (ADR 00 §9) — and pgBackRest refuses secrets on
# its command line for the same reason.
#
# For a service-account JSON file, pgBackRest's `gcs-key` wants a *path*
# inside the container, so mount the file as its own podman secret and
# point at it:
#
#   gcs-key-type=service
#   gcs-key=/run/secrets/pgpod-demo-gcs-key
apiVersion: pgpod/v1
kind: Cluster
metadata:
  name: demo-gcs
spec:
  imageName: docker.io/library/postgres:18

  bootstrap:
    initdb:
      database: appdb
      owner: app

  backup:
    # No `volume:` here — that is only for a local file:// repository.
    # A cloud repository is reached over the network.
    destinations:
      # Bucket plus an optional prefix. The cluster name is always appended
      # by pgpod, so several clusters can share one bucket without
      # colliding: this becomes gs://pgpod-backups/prod/demo-gcs/...
      - url: gs://pgpod-backups/prod

      # A second destination becomes repo2. pgBackRest documents that
      # archive-push "will attempt to push to as many repositories as
      # possible", which is not obviously the fail-unless-all semantics
      # ADR 01 §7 argued for — confirm what the exit status actually is
      # before relying on either (ADR 04 §7). At most four.
      #
      # - url: s3://mirror/pgpod
      #   endpoint: garage.internal:3900   # host and port, never a URL
      #   region: garage                   # Garage's default, not us-east-1
      #   verifyTls: false                 # accepts a self-signed cert
      #   credentials: pgpod-demo-s3
      #
      # pgBackRest always speaks TLS to object storage — there is no
      # plaintext option — so `verifyTls: false` is as far as an insecure
      # local fixture can go.

    # Whole days only — pgBackRest's time-based retention counts them.
    retention: 14d
    # Change to `enforce` to actually delete. Under `report` pgpod
    # configures no retention at all, so pgBackRest keeps everything: a
    # tool that silently deletes backups has to earn that trust first.
    retentionMode: report

# Not supported yet, and deliberately absent rather than ignored: pgpod
# rejects unknown manifest fields, so a `schedule:` here would fail at
# `apply` rather than silently never running. Scheduled backups arrive
# with the daemon in Phase 4 (ROADMAP.md); until then `pgpod backup` is
# something you run, or put in a systemd timer.

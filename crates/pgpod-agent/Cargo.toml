[package]
name = "pgpod-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "pgpod instance manager — PID 1 inside the PostgreSQL container"

[[bin]]
name = "pgpod-agent"
path = "src/main.rs"

# Dependency list is load-bearing: this binary is statically linked against
# musl and bind-mounted into an arbitrary PostgreSQL image. It must never
# grow `podman-api`, `rusqlite`, or anything that pulls in OpenSSL
# (adrs/00-project-setup.md §3).
#
# It got *smaller* in ADR 04: object_store, zstd, sha2 and their transitive
# TLS stack left with the hand-rolled archive engine. pgBackRest does that
# work now, in its own bundle.
[dependencies]
pgpod-core.workspace = true
pgpod-pg.workspace = true
pgpod-backup.workspace = true
pgpod-pooler.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
nix = { workspace = true, features = ["user", "fs", "signal", "process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time", "sync"] }

[dev-dependencies]
tempfile.workspace = true

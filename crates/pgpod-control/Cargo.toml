[package]
name = "pgpod-control"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "pgpod control plane: reconciler, scheduler, and the library facade"

[dependencies]
pgpod-core.workspace = true
pgpod-runtime.workspace = true
pgpod-registry.workspace = true
pgpod-pg.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
rand.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile.workspace = true

[features]
# Tests that drive a real podman socket and start a real PostgreSQL.
# Off by default so `cargo test --workspace` stays green without one.
podman-tests = []

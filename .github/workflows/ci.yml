name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Host-only checks. No podman, no network, no object storage — these
  # must stay fast enough that nobody is tempted to skip them locally.
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  podman:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install rootless podman stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            podman uidmap passt netavark aardvark-dns fuse-overlayfs

      - name: Pin netavark as the network backend
        run: |
          sudo install -d -m 0755 /etc/containers
          printf '[network]\nnetwork_backend = "netavark"\n' \
            | sudo tee -a /etc/containers/containers.conf

      - name: Start a transient podman service
        run: |
          # Same script developers use locally, so CI and the workstation
          # exercise one code path rather than diverging.
          eval "$(ops/dev-podman.sh start)"
          echo "PGPOD_PODMAN_SOCKET=$PGPOD_PODMAN_SOCKET" >> "$GITHUB_ENV"
          ops/dev-podman.sh status

      - name: Build and install the static agent
        run: ops/build-agent.sh

      - name: Build and install the pgBackRest bundle
        run: ops/build-pgbackrest.sh

      - name: pgpod doctor
        run: cargo run -p pgpod-cli -- doctor

      # `--test-threads=1` is load-bearing, not tidiness.
      #
      # podman 5.7.0 — the deployment target, and this runner — has a race
      # in rootless network-namespace teardown. The netns is shared by every
      # container and refcounted; when the count reaches zero podman kills
      # the network process, and two teardowns arriving together make the
      # second kill hit a PID that is gone or recycled:
      #
      #   removing container <id> network: 1 error occurred:
      #     * rootless netns: kill network process: permission denied
      #
      # Reproduced on 5.7.0 with bare `podman run/stop/rm` and no pgpod
      # involved — 4 of 4 attempts — and not reproducible on 6.1.1, so it
      # appears fixed upstream. It needs the refcount to actually reach
      # zero, which is why it shows up on a clean runner and hides on a
      # workstation that has anything else running.
      #
      # Serialising removes the concurrent teardown. It also matches how
      # pgpod itself behaves: every stop-then-remove in the control plane
      # is sequential and awaited, so nothing here is papering over a race
      # in pgpod's own code.
      - name: Podman integration tests
        run: cargo test -p pgpod-runtime --features podman-tests -- --nocapture --test-threads=1

      - name: End-to-end apply/delete lifecycle
        run: cargo test -p pgpod-control --features podman-tests -- --nocapture --test-threads=1

      - name: Stop the podman service
        if: always()
        run: ops/dev-podman.sh stop
